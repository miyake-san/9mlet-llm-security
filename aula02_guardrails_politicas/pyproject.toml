[project]
name = "aula02-guardrails-politicas"
version = "0.1.0"
description = "Aula 02 — Guardrails e Políticas de Segurança para LLMs (defense-in-depth, NeMo/Colang, Guardrails AI, Llama Guard, Azure AI Content Safety)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Diogo Miyake" }]
keywords = ["llm-security", "guardrails", "defense-in-depth", "nemo-guardrails", "llama-guard", "content-safety"]

# Dependências de runtime da APLICAÇÃO (app/ + src/). Mantidas LEVES e offline-first:
# o pipeline de guardrails funciona sem torch/transformers por padrão (implementações
# determinísticas em Python), de modo que `uv sync` + `uv run task test` rodem sem
# baixar modelos pesados. Os frameworks de mercado (NeMo, Guardrails AI, AACS) são o
# caminho de PRODUÇÃO e ficam em grupos opcionais (ver [dependency-groups]).
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.35.0",
    "httpx>=0.27.0,<0.28.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "faker>=26.0.0,<31.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.urls]
Repository = "https://github.com/miyake-san/9mlet-llm-security"

# Grupos de dependências (PEP 735). Apenas `dev` é instalado por padrão no `uv sync`.
[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "taskipy>=1.13.0",
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
]
# Frameworks de guardrails de mercado (PESADOS: puxam torch/transformers/onnx).
# NÃO instalados por padrão. Caminho de PRODUÇÃO discutido no Doc 04 (seções 5-6).
# Habilite com: `uv sync --group frameworks`
frameworks = [
    "nemoguardrails>=0.10.0",
    "guardrails-ai>=0.5.0",
]
# Backend/serviços Azure opcionais (AACS + Azure OpenAI/Foundry). Doc 04, seção 7.
# Habilite com: `uv sync --group azure`
azure = [
    "azure-ai-contentsafety>=1.0.0",
    "openai>=1.40.0",
    "azure-identity>=1.17.0",
]

[tool.uv]
# Coleção de material didático — não é um pacote instalável.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebooks são artefatos didáticos com células propositalmente compactas
# (imports agrupados, ; para brevidade). Não os submetemos ao lint de estilo.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# Permite `from app... import` e `from src... import` sem instalar como pacote.
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]

# Atalhos de tarefa — execute com: `uv run task <nome>`
[tool.taskipy.tasks]
up = "docker compose up -d"
down = "docker compose down -v"
logs = "docker compose logs -f"
gateway = "uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
rag = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
seed-data = "python scripts/generate_datasets.py"
eval = "python -m app.guardrails --evaluate --backend stub --report reports/guardrail_eval.json"
scan = "python -m app.guardrails --evaluate --live --report reports/guardrail_eval_live.json"
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
lab = "jupyter lab"
