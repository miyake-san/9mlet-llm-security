# ==========================================================================
# docker-compose.yml — Lab da Aula 02 (vídeo 4)
# Pipeline de guardrails multi-camada (defense-in-depth) para o Aurora Assist.
# Sobe tudo com um comando:  docker compose up -d
#
#   Cliente ─▶ guardrail-gateway (8080)  ─▶ rag-api (8000) ─▶ ollama (11434)
#             [input · behavior · AACS]      [Aurora Assist]     [LLM local]
#             [output · Llama Guard ]
#
# Contêineres endurecidos (Doc 04, seção 8: trade-off segurança × custo, e o
# princípio do menor privilégio FORA do modelo). Se sua plataforma não suportar
# seccomp/read_only (ex.: alguns setups Windows), comente as linhas indicadas.
# ==========================================================================
name: aula02-guardrails

x-hardening: &hardening
  # Âncora YAML reaproveitada pelos serviços do app (menor privilégio no host).
  user: "10001:10001"
  read_only: true                         # comente se sua plataforma reclamar
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp=./configs/seccomp.json      # comente para usar o perfil padrão
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  # --- Aurora Assist backend (RAG/chat) — protegido POR TRÁS do gateway ---
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aurora-assist-guardrail:aula02
    container_name: aula02-rag
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      APP_ROLE: rag
      APP_PORT: "8000"
      LLM_BACKEND: ${LLM_BACKEND:-groq}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_MIN_INTERVAL_SECONDS: ${GROQ_MIN_INTERVAL_SECONDS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    <<: *hardening
    volumes:
      - ./data:/app/data:ro               # datasets sintéticos (somente leitura)
      - ./reports:/app/reports:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [aurora]

  # --- Gateway de guardrails: input + behavior + output + moderação -------
  guardrail-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: aurora-assist-guardrail:aula02
    container_name: aula02-gateway
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    environment:
      APP_ROLE: gateway
      APP_PORT: "8080"
      RAG_API_URL: http://rag-api:8000
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      # AACS opcional — se AACS_ENDPOINT/AACS_KEY vazios, usa o stub local.
      AACS_ENDPOINT: ${AACS_ENDPOINT:-}
      AACS_KEY: ${AACS_KEY:-}
      AACS_BLOCK_THRESHOLD: ${AACS_BLOCK_THRESHOLD:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    depends_on:
      rag-api:
        condition: service_healthy
    <<: *hardening
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports:rw
      - ./configs:/app/configs:ro         # thresholds e políticas ajustáveis sem rebuild
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [aurora]

networks:
  aurora:
    driver: bridge
