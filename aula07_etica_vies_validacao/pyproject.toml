[project]
name = "aula07-etica-vies-validacao"
version = "0.1.0"
description = "Aula 07 — Ética, Viés e Validação de Qualidade em LLMs (Responsible AI, Fairlearn, counterfactual fairness, BLEU/ROUGE/BERTScore, LLM-as-Judge, RAGAS, quality gates)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Diogo Miyake" }]
keywords = ["llm-security", "responsible-ai", "fairness", "fairlearn", "ragas", "llm-as-judge", "bertscore"]

# Dependências de runtime da APLICAÇÃO (app/ + src/). Mantidas LEVES e offline-first
# para que `uv sync` + `uv run task test` funcionem sem baixar modelos pesados
# (torch/transformers). As métricas de fairness/qualidade têm implementação pura
# em `src/security/`, e as bibliotecas de referência ficam em grupos opcionais.
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.35.0",
    "httpx>=0.27.0,<0.28.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "faker>=26.0.0,<31.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.urls]
Repository = "https://github.com/miyake-san/9mlet-llm-security"

# Grupos de dependências (PEP 735). Apenas `dev` é instalado por padrão no `uv sync`.
[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "taskipy>=1.13.0",
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]
# Bibliotecas de referência de avaliação responsável (PESADAS: puxam torch/
# transformers/datasets). NÃO instaladas por padrão — o pipeline offline usa as
# implementações puras de `src/security/`. Habilite com: `uv sync --group eval`
# (ou use o container `eval-runner`). O `promptfoo` (se usado) vem via npm.
eval = [
    "fairlearn>=0.10.0,<0.12.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "bert-score>=0.3.13,<0.4.0",
    "ragas>=0.1.0,<0.2.0",
    "datasets>=2.19.0,<3.0.0",
    "evaluate>=0.4.0,<0.5.0",
]
# Backend/avaliadores Azure (Azure OpenAI + Azure AI Evaluation SDK).
# Habilite com: `uv sync --group azure`.
azure = [
    "openai>=1.40.0",
    "azure-ai-evaluation>=1.0.0",
    "azure-identity>=1.17.0",
]

[tool.uv]
# Coleção de material didático — não é um pacote instalável.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Notebooks didáticos usam idiomas legítimos de aula: setup de `sys.path`/`os.environ`
# antes dos imports (E402), células de demonstração compactas com `;` (E702), imports
# ilustrativos (F401/I001), formatação com `%` para saídas legíveis (UP031) e linhas de
# saída longas (E501). O código de app/src/tests permanece estritamente verificado.
[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501", "E702", "B905", "F401", "I001", "UP031"]

[tool.pytest.ini_options]
# Permite `from app... import` e `from src... import` sem instalar como pacote.
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]

# Atalhos de tarefa — execute com: `uv run task <nome>`
[tool.taskipy.tasks]
up = "docker compose up -d"
down = "docker compose down -v"
logs = "docker compose logs -f"
api = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
seed-data = "python scripts/generate_datasets.py"
eval = "python -m app.eval_ragas --report reports/eval_report.json"
gate = "python -m app.eval_ragas --report reports/eval_report.json --gate --mitigate"
scan = "docker compose --profile eval run --rm eval-runner"
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
lab = "jupyter lab"
