# ==========================================================================
# docker-compose.yml — Lab da Aula 04 (vídeo 4)
# Sobe tudo com um comando:  docker compose up -d
# Campanha de red team (opcional/pesada):  docker compose --profile redteam run --rm redteam-ci
#
# Contêineres endurecidos (Doc 04, seção 11-12). Se sua plataforma não suportar
# seccomp/read_only (ex.: alguns setups Windows), comente as linhas indicadas.
# ==========================================================================
name: aula04-redteam-auditoria

services:
  # --- Aurora Assist v2.4: alvo DEFENDIDO (guardrail imperfeito, por design) --
  target-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aurora-assist-defended:aula04
    container_name: aula04-target-api
    env_file:
      - path: .env
        required: false
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-groq}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_MIN_INTERVAL_SECONDS: ${GROQ_MIN_INTERVAL_SECONDS:-1}
      MODEL_VERSION: ${MODEL_VERSION:-aurora-assist-2.4.0}
      GUARDRAIL_ENABLED: ${GUARDRAIL_ENABLED:-true}
      GUARDRAIL_NORMALIZE: ${GUARDRAIL_NORMALIZE:-false}
      GUARDRAIL_CONVERSATION: ${GUARDRAIL_CONVERSATION:-false}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      AUDIT_LOG_URL: http://audit-log:8091
      HEALTH_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      audit-log:
        condition: service_healthy
    # ---- Hardening do contêiner ----
    user: "10001:10001"
    read_only: true                       # comente se sua plataforma reclamar
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./configs/seccomp.json    # comente para usar o perfil padrão
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./data:/app/data:ro               # datasets sintéticos (somente leitura)
      - ./reports:/app/reports:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [aurora]

  # --- Trilha de auditoria imutável: hash chain + Merkle (Doc 04, sec. 11) --
  audit-log:
    build:
      context: .
      dockerfile: Dockerfile
    image: aurora-assist-defended:aula04
    container_name: aula04-audit-log
    command: ["uvicorn", "app.audit_log:app", "--host", "0.0.0.0", "--port", "8091"]
    env_file:
      - path: .env
        required: false
    environment:
      AUDIT_CHAIN_PATH: /tmp/audit_chain.jsonl
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-aurora-audit}
      HEALTH_PORT: "8091"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8091:8091"
    depends_on:
      opensearch:
        condition: service_healthy
    # ---- Hardening: quem administra a app NÃO administra a evidência ----
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./configs/seccomp.json
    tmpfs:
      - /tmp:size=64m,mode=1777           # cadeia efêmera no lab (WORM real: Azure Blob Immutable)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [aurora]

  # --- OpenSearch: SIEM local (análogo didático ao Azure Sentinel) --------
  # ATENÇÃO: security plugin DESABILITADO — apenas para laboratório offline.
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: aula04-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true      # NÃO faça isto em produção
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    security_opt:
      - no-new-privileges:true
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks: [aurora]

  # --- Runner de red team: PyRIT + Garak + promptfoo + replay (opt-in) ----
  redteam-ci:
    build:
      context: .
      dockerfile: Dockerfile.redteam
    image: aurora-redteam-ci:aula04
    container_name: aula04-redteam-ci
    profiles: [redteam]
    env_file:
      - path: .env
        required: false
    environment:
      TARGET_API_URL: http://target-api:8000
      AUDIT_LOG_URL: http://audit-log:8091
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      REPORT_DIR: /work/reports
    depends_on:
      target-api:
        condition: service_healthy
      audit-log:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ./reports:/work/reports:rw
      - ./data:/work/data:ro
      - ./configs:/work/configs:ro
    networks: [aurora]

volumes:
  ollama-models:
  opensearch-data:

networks:
  aurora:
    driver: bridge
