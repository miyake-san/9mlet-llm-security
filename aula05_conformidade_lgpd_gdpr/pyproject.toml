[project]
name = "aula05-conformidade-lgpd-gdpr"
version = "0.1.0"
description = "Aula 05 — Conformidade Regulatória: LGPD, GDPR e EU AI Act (consentimento granular, registro de tratamento art. 37, DPIA, classificação de risco EU AI Act, direito ao esquecimento em vector store)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Diogo Miyake" }]
keywords = ["llm-security", "lgpd", "gdpr", "eu-ai-act", "dpia", "privacy-by-design", "machine-unlearning"]

# Dependências de runtime da APLICAÇÃO (app/ + src/). Mantidas LEVES e
# offline-first para que `uv sync` + `uv run task test` funcionem sem baixar
# modelos pesados nem exigir nuvem (Postgres/Qdrant/Presidio são OPCIONAIS).
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.35.0",
    "httpx>=0.27.0,<0.28.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "faker>=26.0.0,<31.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.urls]
Repository = "https://github.com/miyake-san/9mlet-llm-security"

# Grupos de dependências (PEP 735). Apenas `dev` é instalado por padrão no `uv sync`.
[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "taskipy>=1.13.0",
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]
# Store relacional do consent-service (persistência versionada). Habilite com:
# `uv sync --group postgres`. Offline usa store em memória/arquivo (sem Postgres).
postgres = [
    "psycopg[binary]>=3.2.0,<4.0.0",
]
# Vector store para purga seletiva (direito ao esquecimento). Habilite com:
# `uv sync --group qdrant`. Offline usa InMemoryVectorStore.
qdrant = [
    "qdrant-client>=1.11.0,<2.0.0",
]
# Microsoft Presidio para minimização de dados (PESADO: puxa spaCy). NÃO instalado
# por padrão. Habilite com `uv sync --group presidio` ou use os containers oficiais.
presidio = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]
# Backend/serviços Azure (Cosmos DB, AI Search, OpenAI). Habilite com:
# `uv sync --group azure`. Caminho de produção documentado no README.
azure = [
    "openai>=1.40.0",
    "azure-identity>=1.17.0",
    "azure-cosmos>=4.7.0",
    "azure-search-documents>=11.5.0",
]

[tool.uv]
# Coleção de material didático — não é um pacote instalável.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebooks são artefatos didáticos com células propositalmente compactas
# (imports agrupados, ; para brevidade). Não os submetemos ao lint de estilo.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# Permite `from app... import` e `from src... import` sem instalar como pacote.
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]

# Atalhos de tarefa — execute com: `uv run task <nome>`
[tool.taskipy.tasks]
up = "docker compose up -d"
down = "docker compose down -v"
logs = "docker compose logs -f"
api = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
consent-api = "uvicorn app.consent:app --host 0.0.0.0 --port 8010 --reload"
seed-data = "python scripts/generate_datasets.py"
dpia = "python -m app.dpia --classify --report reports/dpia_aurora_assist.md"
purge = "python -m app.purge --process-requests --report reports/purge_report.json"
ropa = "python -m src.security.treatment --self-test"
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
lab = "jupyter lab"
