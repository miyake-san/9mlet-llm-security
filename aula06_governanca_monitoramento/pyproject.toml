[project]
name = "aula06-governanca-monitoramento"
version = "0.1.0"
description = "Aula 06 — LLMOps: Governança de Dados e Monitoramento Contínuo (drift KS/PSI/MMD/Wasserstein, observabilidade OpenTelemetry gen_ai.*, Langfuse, SLIs/SLOs/Data SLOs, error budget, token economics)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Diogo Miyake" }]
keywords = ["llm-security", "llmops", "observability", "drift-detection", "opentelemetry", "slo", "data-slo"]

# Dependências de runtime da APLICAÇÃO (app/ + src/). Mantidas LEVES,
# offline-first e compatíveis com Python 3.12 E 3.14 para que `uv sync` +
# `uv run task test` funcionem sem baixar modelos pesados nem exigir nuvem.
# Os testes estatísticos de drift (KS, PSI, MMD, Wasserstein) são implementados
# em NumPy puro (Doc 04, §"Detecção estatística de drift"); scipy/scikit-learn
# entram apenas no grupo opcional `stats` para cross-validação nos notebooks.
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.35.0",
    "httpx>=0.27.0,<0.28.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "faker>=26.0.0,<31.0.0",
    "rich>=13.7.0,<14.0.0",
    "numpy>=1.26.0,<3.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
]

[project.urls]
Repository = "https://github.com/miyake-san/9mlet-llm-security"

# Grupos de dependências (PEP 735). Apenas `dev` é instalado por padrão no `uv sync`.
[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "taskipy>=1.13.0",
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]
# Cross-validação estatística do drift (vídeo 2). Reproduz os snippets do Doc 04
# (scipy.stats.ks_2samp, sklearn.metrics.pairwise.rbf_kernel) sobre a MESMA
# implementação NumPy do repo. Habilite com: `uv sync --group stats`.
stats = [
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
]
# Export REAL de traces/métricas via OpenTelemetry (vídeo 3). Offline usa o
# coletor de spans em memória (gen_ai.*). Habilite com: `uv sync --group otel`.
otel = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
# Langfuse: tracing por step (latência/tokens/custo). Habilite com:
# `uv sync --group langfuse` (o serviço `langfuse` do compose é o backend/UI).
langfuse = [
    "langfuse>=2.50.0,<3.0.0",
]
# Evidently AI: relatórios de drift/qualidade (produção). PESADO. Habilite com:
# `uv sync --group evidently` (gera HTML em reports/).
evidently = [
    "evidently>=0.4.30",
]
# Backend/serviços Azure (Azure OpenAI + Azure Monitor). Habilite com:
# `uv sync --group azure`. Caminho de produção documentado no README.
azure = [
    "openai>=1.40.0",
    "azure-identity>=1.17.0",
    "azure-monitor-opentelemetry>=1.6.0",
]

[tool.uv]
# Coleção de material didático — não é um pacote instalável.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebooks são artefatos didáticos com células propositalmente compactas
# (imports agrupados, ; para brevidade). Não os submetemos ao lint de estilo.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# Permite `from app... import` e `from src... import` sem instalar como pacote.
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]

# Atalhos de tarefa — execute com: `uv run task <nome>`
[tool.taskipy.tasks]
up = "docker compose up -d"
down = "docker compose down -v"
logs = "docker compose logs -f"
api = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
seed-data = "python scripts/generate_datasets.py"
drift = "python -m app.drift --report reports/drift_report.json"
slo = "python -m src.security.slo --self-test"
monitor = "python -m app.observability --self-test"
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
lab = "jupyter lab"
