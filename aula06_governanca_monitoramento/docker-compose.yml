# ==========================================================================
# docker-compose.yml — Lab da Aula 06 (vídeo 4)
# Sobe a stack de OBSERVABILIDADE + MONITORAMENTO com um comando:
#   docker compose up -d
#
# Pipeline de observabilidade (Doc 04, Figura 3), da esquerda para a direita:
#   app (Aurora Assist v2.6, instrumentado com gen_ai.*) -> traces por step no
#   Langfuse -> métricas Prometheus (/metrics) -> dashboards de qualidade, custo
#   e segurança no Grafana. O `app` também expõe /drift/check e /slo/report.
#
# Offline-first: o LLM roda localmente via Ollama (sem nuvem). Azure Monitor é o
# caminho de produção documentado no README. Evidently AI é usado como BIBLIOTECA
# (notebook 02 / `uv run task drift`), não como serviço — ver README.
#
# Contêineres endurecidos (a telemetria não pode ampliar a superfície de ataque).
# Se sua plataforma não suportar seccomp/read_only (ex.: alguns setups Windows),
# comente as linhas indicadas.
# ==========================================================================
name: aula06-governanca-monitoramento

services:
  # --- Postgres: backend de persistência do Langfuse ---------------------
  postgres:
    image: postgres:16.4-bookworm
    container_name: aula06-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
      POSTGRES_USER: ${POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langfuse-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langfuse} -d ${POSTGRES_DB:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks: [aurora]

  # --- Langfuse: tracing por step (latência/tokens/custo) — Doc 04, §Obs. -
  # Imagem oficial (v2, single-container). A UI expõe traces gen_ai.* como uma
  # cascata legível (Figura 3). Gere as chaves de API na UI após subir a stack.
  langfuse:
    image: langfuse/langfuse:2
    container_name: aula06-langfuse
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-langfuse}:${POSTGRES_PASSWORD:-langfuse-dev-only}@postgres:5432/${POSTGRES_DB:-langfuse}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme-nextauth-dev-only}
      SALT: ${LANGFUSE_SALT:-changeme-salt-dev-only}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks: [aurora]

  # --- Aurora Assist v2.6: app OTel-instrumentado (rag-api) --------------
  # Cada /chat gera um span gen_ai.* (modelo, tokens, custo, latência, groundedness,
  # cache_hit, pii_leak). Expõe /metrics (Prometheus), /drift/check e /slo/report.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aurora-assist-observable:aula06
    container_name: aula06-app
    env_file:
      - path: .env
        required: false
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-groq}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_MIN_INTERVAL_SECONDS: ${GROQ_MIN_INTERVAL_SECONDS:-1}
      MODEL_VERSION: ${MODEL_VERSION:-aurora-assist-2.6.0}
      LLMOPS_MATURITY_LEVEL: ${LLMOPS_MATURITY_LEVEL:-1}
      MINIMIZE_TELEMETRY_PII: ${MINIMIZE_TELEMETRY_PII:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-aurora-assist}
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-true}
      # Descomente para exportar spans reais via OTLP (requer grupo `otel`):
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_HOST: http://langfuse:3000
      COST_INPUT_PER_1K: ${COST_INPUT_PER_1K:-0.005}
      COST_OUTPUT_PER_1K: ${COST_OUTPUT_PER_1K:-0.015}
      MODEL_ROUTING_ENABLED: ${MODEL_ROUTING_ENABLED:-true}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-true}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.92}
      TRACE_STORE_PATH: /tmp/traces.jsonl
      HEALTH_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    # ---- Hardening do contêiner ----
    user: "10001:10001"
    read_only: true                       # comente se sua plataforma reclamar
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./configs/seccomp.json    # comente para usar o perfil padrão
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./data:/app/data:ro               # datasets sintéticos (somente leitura)
      - ./reports:/app/reports:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [aurora]

  # --- Prometheus: coleta as métricas SLI expostas em /metrics -----------
  # Raspa o app periodicamente (Doc 04, §SLIs — latência, custo, drift, bloqueio).
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aula06-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=3d"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [aurora]

  # --- Grafana: dashboards de qualidade, custo e segurança — Doc 04, §Obs. -
  # Datasource Prometheus e dashboard "Aurora LLMOps" já provisionados.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: aula06-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-dev-only}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [aurora]

networks:
  aurora:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
